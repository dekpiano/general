<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Inner Border Frame -->
  <rect x="12" y="12" width="376" height="276" rx="12" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
  
  <!-- Center Graphic Icon -->
  <g transform="translate(150, 75)" filter="url(#subtleShadow)">
    <!-- Image Frame Box -->
    <rect x="0" y="0" width="100" height="80" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Sun / Circle -->
    <circle cx="30" cy="28" r="8" fill="#cbd5e1"/>
    <!-- Mountains -->
    <path d="M12 68 L38 38 L55 58 L72 44 L88 68 Z" fill="url(#iconGrad)"/>
    <!-- Missing Badge -->
    <circle cx="82" cy="18" r="14" fill="#ef4444"/>
    <line x1="75" y1="11" x2="89" y2="25" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Text Label -->
  <text x="200" y="205" text-anchor="middle" font-family="'Prompt', 'Kanit', 'TH Sarabun New', sans-serif" font-size="22" font-weight="700" fill="#475569">
    ไม่มีรูปภาพ / ไม่ได้แนบรูปมา
  </text>
  <text x="200" y="230" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
    No Image Available
  </text>
</svg>
