version: '3.8'

services:
  app:
    container_name: general2025_app
    build: .
    ports:
      - "8085:80"
      - "8086:443"
    volumes:
      - .:/var/www/html:cached
      - app_writable:/var/www/html/writable
    environment:
      # Database connection settings for CodeIgniter
      DB_HOST: skj2025_db
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: rootpassword
    networks:
      - skj2025_default

volumes:
  app_writable:

networks:
  skj2025_default:
    external: true
